  <!-- Solar panels (4 pairs) -->
  <rect x="15" y="23" width="6" height="7" rx="0.5" fill="#7080e0"/>
  <rect x="15" y="32.5" width="6" height="7" rx="0.5" fill="#7080e0"/>
  <rect x="24" y="23" width="6" height="7" rx="0.5" fill="#7080e0"/>
  <rect x="24" y="32.5" width="6" height="7" rx="0.5" fill="#7080e0"/>
  <rect x="34" y="23" width="6" height="7" rx="0.5" fill="#7080e0"/>
  <rect x="34" y="32.5" width="6" height="7" rx="0.5" fill="#7080e0"/>
  <rect x="43" y="23" width="6" height="7" rx="0.5" fill="#7080e0"/>
  <rect x="43" y="32.5" width="6" height="7" rx="0.5" fill="#7080e0"/>
  <!-- Modules (center body) -->
  <rect x="26" y="28" width="12" height="6" rx="1.5" fill="#a0a8d0"/>
