  <ellipse cx="32" cy="32" rx="24" ry="7" fill="none" stroke="#e8cc70" stroke-width="4" transform="rotate(-20 32 32)"/>
  <!-- ISS silhouette (centered on planet) -->
  <!-- Main truss -->
