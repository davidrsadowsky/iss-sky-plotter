<script>
'use strict';

// ── CONFIG ──────────────────────────────────────────────────────────────
const SUN_MAX_ALT   = -6;         // degrees — sun must be below this (civil twilight)
const GOOGLE_ELEVATION_API_KEY = 'AIzaSyCzBfzymO3sYdpa2cUT5py0wZJ-R2pRip4';
const STEP_MS       = 15 * 1000;  // 15-second scan steps

function getCloseDeg()  { return parseFloat(document.getElementById('sel-threshold').value); }
function getDaysAhead() { return Math.min(60, Math.max(1, parseInt(document.getElementById('inp-days').value) || 10)); }
function getUnits()     { return document.getElementById('sel-units').value; }
function getShowMode()  { return document.getElementById('sel-show').value; }
// ────────────────────────────────────────────────────────────────────────

let currentLat = null, currentLon = null;
let currentPasses = [];
let leafletMap = null;

const PLANETS = ['Moon', 'Mercury', 'Venus', 'Mars', 'Jupiter', 'Saturn'];
const PLANET_COLORS = {
  Moon:    '#ddddd8', // silvery-grey
  Mercury: '#a89878', // dark brownish-grey
  Venus:   '#fff4a0', // creamy pale yellow
  Mars:    '#ff6640', // orangey-red
  Jupiter: '#e8b870', // warm tan-orange
  Saturn:  '#e8cc70', // golden yellow
};
const DEG = Math.PI / 180;
const R_EARTH_KM = 6371;
const AU_KM = 149597870.7;

// ── TLE ─────────────────────────────────────────────────────────────────
// Embedded TLE (from generate.js) — used as last-resort offline fallback
let TLE = (() => {
  try { return JSON.parse(document.getElementById('tle-data').textContent.trim()); }
  catch(e) { return { name: '', line1: '', line2: '', epoch: '', generated: '', source: 'embedded' }; }
})();

// ── UTILS ────────────────────────────────────────────────────────────────
function isInShadow(posEci, sunEci) {
  const dot = posEci.x * sunEci.x + posEci.y * sunEci.y + posEci.z * sunEci.z;
  if (dot > 0) return false;
  const satMag2 = posEci.x ** 2 + posEci.y ** 2 + posEci.z ** 2;
  const sunMag2 = sunEci.x ** 2 + sunEci.y ** 2 + sunEci.z ** 2;
  const perp2 = satMag2 - (dot * dot) / sunMag2;
  return perp2 < R_EARTH_KM * R_EARTH_KM;
}

function angSepDeg(az1d, alt1d, az2d, alt2d) {
  const alt1 = alt1d * DEG, alt2 = alt2d * DEG;
  const daz = (az1d - az2d) * DEG;
  const cosA = Math.sin(alt1) * Math.sin(alt2) + Math.cos(alt1) * Math.cos(alt2) * Math.cos(daz);
  return Math.acos(Math.max(-1, Math.min(1, cosA))) / DEG;
}

const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
function azToCompass(deg) { return COMPASS[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16]; }

function fmtTime(d) {
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: true });
}
function fmtDate(d) {
  return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}
function fmtDur(ms) {
  const s = Math.round(ms / 1000);
  return s >= 60 ? `${Math.floor(s/60)}m ${s%60}s` : `${s}s`;
}

function setStatus(msg) {
  document.getElementById('status-bar').textContent = msg;
}

// ── PLANET POSITIONS ─────────────────────────────────────────────────────
function getPlanetPositions(date, lat, lon) {
  const observer = new Astronomy.Observer(lat, lon, 0);
  const time = Astronomy.MakeTime(date);
  const result = {};
  for (const name of PLANETS) {
    try {
      const body = Astronomy.Body[name];
      const equ = Astronomy.Equator(body, time, observer, true, true);
      const hor = Astronomy.Horizon(time, observer, equ.ra, equ.dec, 'normal');
      result[name] = { altitude: hor.altitude, azimuth: hor.azimuth };
    } catch (e) {
      result[name] = { altitude: -90, azimuth: 0 };
    }
  }
  return result;
}

// ── SUN ALTITUDE ─────────────────────────────────────────────────────────
function getSunAlt(astroTime, observer) {
  const equ = Astronomy.Equator(Astronomy.Body.Sun, astroTime, observer, true, true);
  return Astronomy.Horizon(astroTime, observer, equ.ra, equ.dec, 'normal').altitude;
}

// ── PASS FINDER ──────────────────────────────────────────────────────────
function findPasses(lat, lon) {
  const satrec = satellite.twoline2satrec(TLE.line1, TLE.line2);
  const observer = new Astronomy.Observer(lat, lon, 0);
  const obsGd = {
    longitude: lon * DEG,
    latitude:  lat * DEG,
    height: 0,
  };

  const passes = [];
  let cur = null;
  const now = Date.now();
  const end = now + getDaysAhead() * 86400000;

  for (let t = now; t < end; t += STEP_MS) {
    const date = new Date(t);
    const pv = satellite.propagate(satrec, date);
    if (!pv || !pv.position || typeof pv.position === 'boolean') continue;

    const posEci = pv.position;
    const gmst = satellite.gstime(date);
    const posEcf = satellite.eciToEcf(posEci, gmst);
    const look = satellite.ecfToLookAngles(obsGd, posEcf);
    const elev = look.elevation / DEG;

    if (elev < 0) {
      if (cur) { passes.push(cur); cur = null; }
      continue;
    }

    // Check sun altitude and shadow (slightly expensive, only when ISS is up)
    const astroTime = Astronomy.MakeTime(date);
    const sunAlt = getSunAlt(astroTime, observer);
    if (sunAlt > SUN_MAX_ALT) {
      if (cur) { passes.push(cur); cur = null; }
      continue;
    }

    const sunVec = Astronomy.GeoVector(Astronomy.Body.Sun, astroTime, false);
    const sunEci = { x: sunVec.x * AU_KM, y: sunVec.y * AU_KM, z: sunVec.z * AU_KM };
    if (isInShadow(posEci, sunEci)) {
      if (cur) { passes.push(cur); cur = null; }
      continue;
    }

    const az = (look.azimuth / DEG + 360) % 360;
    const pt = { time: date, elevation: elev, azimuth: az };

    if (!cur) {
      cur = { start: pt, end: pt, peak: pt, points: [pt] };
    } else {
      cur.end = pt;
      cur.points.push(pt);
      if (elev > cur.peak.elevation) cur.peak = pt;
    }
  }
  if (cur) passes.push(cur);
  return passes;
}

// ── CLOSE APPROACH FINDER ─────────────────────────────────────────────────
function addCloseApproaches(passes, lat, lon) {
  const satrec = satellite.twoline2satrec(TLE.line1, TLE.line2);
  const obsGd = { longitude: lon * DEG, latitude: lat * DEG, height: 0 };

  for (const pass of passes) {
    const midDate = new Date((pass.start.time.getTime() + pass.end.time.getTime()) / 2);
    const planets = getPlanetPositions(midDate, lat, lon);
    pass.planetPositions = planets;
    pass.closeApproaches = [];

    // Build 1-second resolution ISS positions for this pass (accurate close-approach detection).
    const finePoints = [];
    for (let t = pass.start.time.getTime(); t <= pass.end.time.getTime(); t += 1000) {
      const date = new Date(t);
      const pv = satellite.propagate(satrec, date);
      if (!pv || !pv.position || typeof pv.position === 'boolean') continue;
      const gmst = satellite.gstime(date);
      const posEcf = satellite.eciToEcf(pv.position, gmst);
      const look = satellite.ecfToLookAngles(obsGd, posEcf);
      const elev = look.elevation / DEG;
      if (elev < 0) continue;
      finePoints.push({ elevation: elev, azimuth: (look.azimuth / DEG + 360) % 360 });
    }

    for (const [name, ppos] of Object.entries(planets)) {
      if (ppos.altitude < 0) continue;
      let minSep = Infinity, transitElev = 0;
      for (const pt of finePoints) {
        const sep = angSepDeg(pt.azimuth, pt.elevation, ppos.azimuth, ppos.altitude);
        if (sep < minSep) { minSep = sep; transitElev = pt.elevation; }
      }
      if (minSep <= getCloseDeg()) {
        pass.closeApproaches.push({ planet: name, minSep: Math.round(minSep * 10) / 10, transitElev: Math.round(transitElev) });
      }
    }
    pass.closeApproaches.sort((a, b) => a.minSep - b.minSep);

    // Compute nearest transit distance for each close approach (full pass scan).
    for (const ca of pass.closeApproaches) {
      try {
        const path = computeTransitPath(pass, ca.planet);
        if (path.length > 0) {
          let minDist = Infinity;
          for (const p of path) {
            const d = haversineKm(lat, lon, p.lat, p.lon);
            if (d < minDist) minDist = d;
          }
          ca.transitDistKm = minDist;
        } else {
          ca.transitDistKm = null;
        }
      } catch (_) { ca.transitDistKm = null; }
    }
  }
}

function fmtTransitDist(km) {
  if (km === null) return 'no path';
  if (getUnits() === 'mi') {
    const mi = km * 0.621371;
    if (mi < 1) return `${Math.round(mi * 5280)} ft`;
    if (mi < 100) return `${mi.toFixed(1)} mi`;
    return `${Math.round(mi)} mi`;
  }
  if (km < 1) return `${Math.round(km * 1000)} m`;
  if (km < 100) return `${km.toFixed(1)} km`;
  return `${Math.round(km)} km`;
}

// ── TABLE RENDERER ────────────────────────────────────────────────────────
function renderTable(passes) {
  const tbody = document.getElementById('pass-tbody');
  tbody.innerHTML = '';

  if (passes.length === 0) {
    document.getElementById('no-passes').style.display = 'block';
    document.getElementById('pass-table').style.display = 'none';
    return;
  }

  passes.forEach((pass, i) => {
    const tr = document.createElement('tr');
    if (pass.closeApproaches.length > 0) tr.classList.add('planet-pass');

    const elev = pass.peak.elevation;
    const elevClass = elev >= 60 ? 'elev-high' : elev >= 30 ? 'elev-mid' : 'elev-low';
    const dur = fmtDur(pass.end.time - pass.start.time);
    const startComp = azToCompass(pass.start.azimuth);
    const endComp   = azToCompass(pass.end.azimuth);
    const dir = startComp === endComp ? startComp : `${startComp} → ${endComp}`;

    let nearHtml = '—';
    if (pass.closeApproaches.length > 0) {
      nearHtml = pass.closeApproaches.map(ca => {
        const pColor = PLANET_COLORS[ca.planet] || '#ffc830';
        return `<span class="badge" style="color:${pColor};border:1px solid ${pColor}55;background:#111120">${ca.planet} <span style="opacity:0.85">${ca.minSep}° · ${ca.transitElev}° alt</span></span>` +
               `<button class="btn-transit" onclick="openTransitMap(${pass.idx},'${ca.planet}')">Map (nearest point: ${fmtTransitDist(ca.transitDistKm)})</button>`;
      }).join(' ');
    }

    tr.innerHTML = `
      <td>${i + 1}</td>
      <td>${fmtDate(pass.start.time)}</td>
      <td>${fmtTime(pass.start.time)}</td>
      <td>${fmtTime(pass.peak.time)}</td>
      <td>${fmtTime(pass.end.time)}</td>
      <td>${dur}</td>
      <td class="${elevClass}">${Math.round(elev)}°</td>
      <td>${dir}</td>
      <td>${nearHtml}</td>
    `;
    tr.onclick = () => {
      const card = document.getElementById(`chart-${pass.idx}`);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    };
    tbody.appendChild(tr);
  });
}

// ── SKY CHART RENDERER ────────────────────────────────────────────────────
function drawSkyChart(canvas, pass) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) / 2 - 22;

  // Background
  ctx.fillStyle = '#05050e';
  ctx.fillRect(0, 0, W, H);

  // Altitude rings
  for (const alt of [30, 60]) {
    const r = R * (90 - alt) / 90;
    ctx.strokeStyle = '#14163a';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#252858';
    ctx.font = '8px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(`${alt}°`, cx + r + 2, cy);
  }

  // Horizon
  ctx.strokeStyle = '#203080';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();

  // Cardinal directions (N top, E left — standard sky chart orientation)
  const cards = [['N', 0], ['E', 90], ['S', 180], ['W', 270]];
  ctx.fillStyle = '#4050a0';
  ctx.font = 'bold 10px sans-serif';
  for (const [lbl, az] of cards) {
    const azR = az * DEG;
    const x = cx - Math.sin(azR) * (R + 14);
    const y = cy - Math.cos(azR) * (R + 14);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(lbl, x, y);
  }

  // Planets / Moon
  const planets = pass.planetPositions || {};
  for (const [name, pos] of Object.entries(planets)) {
    if (pos.altitude < 0) continue;
    const r = R * (90 - pos.altitude) / 90;
    const azR = pos.azimuth * DEG;
    const x = cx - Math.sin(azR) * r;
    const y = cy - Math.cos(azR) * r;
    const color = PLANET_COLORS[name] || '#ffffff';
    const radius = name === 'Moon' ? 5 : 3;

    // Highlight ring if close approach
    const ca = (pass.closeApproaches || []).find(c => c.planet === name);
    if (ca) {
      const ringR = Math.max(10, R * getCloseDeg() / 90);
      ctx.strokeStyle = '#ffc830';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.arc(x, y, ringR, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = color;
    ctx.font = ca ? 'bold 9px sans-serif' : '9px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(name, x + radius + 2, y - 4);
  }

  // ISS track
  if (pass.points.length > 1) {
    ctx.strokeStyle = '#00e8cc';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    pass.points.forEach((pt, i) => {
      const r = R * (90 - pt.elevation) / 90;
      const azR = pt.azimuth * DEG;
      const x = cx - Math.sin(azR) * r;
      const y = cy - Math.cos(azR) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Start dot (green)
    const first = pass.points[0];
    const fr = R * (90 - first.elevation) / 90;
    ctx.fillStyle = '#00e8cc';
    ctx.beginPath();
    ctx.arc(cx - Math.sin(first.azimuth * DEG) * fr, cy - Math.cos(first.azimuth * DEG) * fr, 4, 0, Math.PI * 2);
    ctx.fill();

    // End dot (orange)
    const last = pass.points[pass.points.length - 1];
    const lr = R * (90 - last.elevation) / 90;
    ctx.fillStyle = '#ff7040';
    ctx.beginPath();
    ctx.arc(cx - Math.sin(last.azimuth * DEG) * lr, cy - Math.cos(last.azimuth * DEG) * lr, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function renderCharts(passes) {
  const grid = document.getElementById('charts-grid');
  grid.innerHTML = '';

  passes.forEach((pass, i) => {
    const isPlanet = pass.closeApproaches.length > 0;
    const card = document.createElement('div');
    card.className = 'chart-card' + (isPlanet ? ' planet-card' : '');
    card.id = `chart-${pass.idx}`;

    let titleHtml = `<strong>#${pass.idx + 1}</strong> ${fmtDate(pass.start.time)} · ${fmtTime(pass.start.time)}`;
    titleHtml += ` · max ${Math.round(pass.peak.elevation)}°`;
    if (isPlanet) {
      const flags = pass.closeApproaches.map(ca =>
        `<span class="planet-flag" style="color:${PLANET_COLORS[ca.planet] || '#ffc830'}">★ ${ca.planet} ${ca.minSep}° · ${ca.transitElev}° alt</span>` +
        `<button class="btn-transit" onclick="openTransitMap(${pass.idx},'${ca.planet}')">Map (nearest point: ${fmtTransitDist(ca.transitDistKm)})</button>`
      ).join(' ');
      titleHtml += `<br>${flags}`;
    }

    const titleEl = document.createElement('div');
    titleEl.className = 'chart-title';
    titleEl.innerHTML = titleHtml;

    const canvas = document.createElement('canvas');
    canvas.width = 270;
    canvas.height = 270;

    card.appendChild(titleEl);
    card.appendChild(canvas);
    grid.appendChild(card);

    drawSkyChart(canvas, pass);
  });
}

// ── ELEVATION API ────────────────────────────────────────────────────────
// Primary: Google Elevation via corsproxy.io (512 locations, high accuracy).
// Fallback: Open-Topo-Data (100 locations, CORS-native, no key needed).

async function fetchElevationsGoogle(locations) {
  const locStr = locations.map(l => `${l.lat.toFixed(6)},${l.lon.toFixed(6)}`).join('|');
  const googleUrl = `https://maps.googleapis.com/maps/api/elevation/json?locations=${encodeURIComponent(locStr)}&key=${GOOGLE_ELEVATION_API_KEY}`;
  const resp = await fetch(`https://corsproxy.io/?${encodeURIComponent(googleUrl)}`);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  if (data.status !== 'OK') throw new Error(`Google: ${data.status}`);
  return data.results.map(r => r.elevation);
}

async function fetchElevationsOpenTopo(locations) {
  const locStr = locations.map(l => `${l.lat.toFixed(6)},${l.lon.toFixed(6)}`).join('|');
  const resp = await fetch(`https://api.opentopodata.org/v1/srtm90m?locations=${locStr}`);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  const data = await resp.json();
  if (data.status !== 'OK') throw new Error(`OpenTopo: ${data.status}`);
  return data.results.map(r => r.elevation);
}

// ── LIVE TLE FETCHING ─────────────────────────────────────────────────────

function parseTLEEpoch(line1) {
  const raw = line1.substring(18, 32).trim();
  const yr = parseInt(raw.substring(0, 2));
  const fullYear = yr < 57 ? 2000 + yr : 1900 + yr;
  const doy = parseFloat(raw.substring(2));
  const d = new Date(Date.UTC(fullYear, 0, 1));
  d.setUTCDate(d.getUTCDate() + Math.floor(doy) - 1);
  const hours = (doy % 1) * 24;
  d.setUTCHours(Math.floor(hours));
  d.setUTCMinutes(Math.floor((hours % 1) * 60));
  return d.toUTCString().replace(' GMT', ' UTC');
}

function parseTLEText(text, source) {
  const lines = text.trim().split('\n').map(l => l.trim()).filter(Boolean);
  const idx = lines.findIndex(l => /^1 \d{5}/.test(l));
  if (idx < 0 || !lines[idx + 1]) return null;
  const line1 = lines[idx], line2 = lines[idx + 1];
  return {
    name: idx > 0 ? lines[idx - 1] : 'ISS (ZARYA)',
    line1, line2,
    epoch: parseTLEEpoch(line1),
    generated: new Date().toLocaleString(),
    source,
  };
}

async function initTLE() {
  document.getElementById('btn-locate').disabled = true;
  document.getElementById('btn-refresh-tle').disabled = true;
  document.getElementById('tle-subtitle').textContent = 'Fetching latest ISS data…';

  // 1. Try ARISS live feed (CORS-enabled)
  try {
    const resp = await fetch('https://live.ariss.org/iss.txt', { cache: 'no-store' });
    if (resp.ok) {
      const parsed = parseTLEText(await resp.text(), 'ARISS (live)');
      if (parsed) {
        TLE = parsed;
        document.getElementById('tle-subtitle').textContent =
          `TLE epoch: ${TLE.epoch} · Live from ARISS · ${TLE.generated}`;
        document.getElementById('btn-locate').disabled = false;
        document.getElementById('btn-refresh-tle').disabled = false;
        return;
      }
    }
  } catch (_) {}

  // 2. Try tle.json from the same site (kept fresh by GitHub Actions)
  try {
    const resp = await fetch('./tle.json', { cache: 'no-store' });
    if (resp.ok) {
      const data = await resp.json();
      if (data.line1) {
        TLE = data;
        document.getElementById('tle-subtitle').textContent =
          `TLE epoch: ${TLE.epoch} · Backup (Celestrak via GitHub) · ${new Date(TLE.generated).toLocaleString()}`;
        document.getElementById('btn-locate').disabled = false;
        document.getElementById('btn-refresh-tle').disabled = false;
        return;
      }
    }
  } catch (_) {}

  // 3. Fall back to embedded TLE from generate.js
  if (TLE.line1) {
    document.getElementById('tle-subtitle').textContent =
      `TLE epoch: ${TLE.epoch} · Offline cached data · ${TLE.generated}`;
  } else {
    document.getElementById('tle-subtitle').textContent = 'Could not load ISS data — check your connection and click ↻ Refresh.';
  }
  document.getElementById('btn-locate').disabled = false;
  document.getElementById('btn-refresh-tle').disabled = false;
}

async function refreshTLE() {
  await initTLE();
  if (currentLat !== null && currentLon !== null) run(currentLat, currentLon, null);
}

// ── TRANSIT PATH ──────────────────────────────────────────────────────────

function findTransitPoint(satEci, bodyEci) {
  // Find the point O on Earth's surface where O, ISS, and body are collinear.
  // Direction from body through ISS toward observer:
  const dx = satEci.x - bodyEci.x, dy = satEci.y - bodyEci.y, dz = satEci.z - bodyEci.z;
  const dLen = Math.sqrt(dx*dx + dy*dy + dz*dz);
  if (dLen === 0) return null;
  const dHat = { x: dx/dLen, y: dy/dLen, z: dz/dLen };

  // O = P_sat + λ·D̂,  |O|² = R_earth²
  // → λ² + 2(P_sat·D̂)λ + (|P_sat|²−R_earth²) = 0
  const a = satEci.x*dHat.x + satEci.y*dHat.y + satEci.z*dHat.z;
  const c = satEci.x**2 + satEci.y**2 + satEci.z**2 - R_EARTH_KM**2;
  const disc = a*a - c;
  if (disc < 0) return null;

  const sqrtDisc = Math.sqrt(disc);
  // Smaller positive root = near-Earth intersection (observer side)
  const lam1 = -a - sqrtDisc, lam2 = -a + sqrtDisc;
  const lam = lam1 > 0 ? lam1 : lam2 > 0 ? lam2 : null;
  if (lam === null) return null;

  return { x: satEci.x + lam*dHat.x, y: satEci.y + lam*dHat.y, z: satEci.z + lam*dHat.z };
}

function findTransitPointAtElevation(satEci, bodyEci, elevKm) {
  const R = R_EARTH_KM + elevKm;
  const dx = satEci.x - bodyEci.x, dy = satEci.y - bodyEci.y, dz = satEci.z - bodyEci.z;
  const dLen = Math.sqrt(dx*dx + dy*dy + dz*dz);
  if (dLen === 0) return null;
  const dHat = { x: dx/dLen, y: dy/dLen, z: dz/dLen };
  const a = satEci.x*dHat.x + satEci.y*dHat.y + satEci.z*dHat.z;
  const c = satEci.x**2 + satEci.y**2 + satEci.z**2 - R**2;
  const disc = a*a - c;
  if (disc < 0) return null;
  const sqrtDisc = Math.sqrt(disc);
  const lam1 = -a - sqrtDisc, lam2 = -a + sqrtDisc;
  const lam = lam1 > 0 ? lam1 : lam2 > 0 ? lam2 : null;
  if (lam === null) return null;
  return { x: satEci.x + lam*dHat.x, y: satEci.y + lam*dHat.y, z: satEci.z + lam*dHat.z };
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const dLat = (lat2 - lat1) * DEG, dLon = (lon2 - lon1) * DEG;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*DEG) * Math.cos(lat2*DEG) * Math.sin(dLon/2)**2;
  return 2 * R_EARTH_KM * Math.asin(Math.sqrt(a));
}

function computeTransitPath(pass, planetName) {
  const satrec = satellite.twoline2satrec(TLE.line1, TLE.line2);
  const body = Astronomy.Body[planetName];
  const points = [];
  const startT = pass.start.time.getTime(), endT = pass.end.time.getTime();

  // Precession+nutation rotation matrix computed once at pass midpoint:
  // the matrix changes by only ~0.001 arcsec during a 6-min pass, negligible.
  const midAstroTime = Astronomy.MakeTime(new Date((startT + endT) / 2));
  const rot = Astronomy.Rotation_EQJ_EQD(midAstroTime);

  for (let t = startT; t <= endT; t += 100) {
    const date = new Date(t);
    const pv = satellite.propagate(satrec, date);
    if (!pv || !pv.position || typeof pv.position === 'boolean') continue;

    const posEci = pv.position; // km, TEME
    const gmst = satellite.gstime(date);
    const astroTime = Astronomy.MakeTime(date);

    // Body position: J2000 (AU) → EQD ≈ TEME (km), so both vectors are in same frame
    const vecJ2000 = Astronomy.GeoVector(body, astroTime, false);
    const vecEqd   = Astronomy.RotateVector(rot, vecJ2000);
    const bodyEci  = { x: vecEqd.x * AU_KM, y: vecEqd.y * AU_KM, z: vecEqd.z * AU_KM };

    const transitEci = findTransitPoint(posEci, bodyEci);
    if (!transitEci) continue;

    const geod = satellite.eciToGeodetic(transitEci, gmst);
    points.push({
      lat: geod.latitude / DEG, lon: geod.longitude / DEG, time: date,
      satEci: { x: posEci.x, y: posEci.y, z: posEci.z },
      bodyEci: { x: bodyEci.x, y: bodyEci.y, z: bodyEci.z },
    });
  }
  return points;
}

function openTransitMap(passIndex, planetName) {
  const pass = currentPasses[passIndex];
  if (!pass || currentLat === null) return;

  // Show modal and reset content
  const modal = document.getElementById('map-modal');
  document.getElementById('map-title').textContent =
    `ISS near ${planetName}  ·  Pass #${passIndex + 1}  ·  ${fmtDate(pass.start.time)}  ${fmtTime(pass.start.time)}`;
  document.getElementById('map-info').textContent = 'Computing transit path…';
  modal.style.display = 'flex';

  // Destroy any previous map instance before (re)creating
  if (leafletMap) { leafletMap.remove(); leafletMap = null; }
  leafletMap = L.map('map-container', { worldCopyJump: true })
    .setView([currentLat, currentLon], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 18,
  }).addTo(leafletMap);

  // User location (blue)
  L.circleMarker([currentLat, currentLon], {
    radius: 10, color: '#fff', weight: 2, fillColor: '#4080ff', fillOpacity: 0.9,
  }).addTo(leafletMap).bindPopup('📍 Your location');

  // Compute transit path
  const path = computeTransitPath(pass, planetName);
  const ca = pass.closeApproaches.find(c => c.planet === planetName);

  if (path.length < 2) {
    document.getElementById('map-info').innerHTML =
      `<span style="color:#ff8060">No transit path found during this pass window.</span>` +
      (ca ? ` The ISS passes ${ca.minSep}° from ${planetName} as seen from your location, but the exact alignment line does not cross Earth's surface during this pass.` : '');
    leafletMap.invalidateSize();
    return;
  }

  // Transit path polyline (gold)
  const latlngs = path.map(p => [p.lat, p.lon]);
  const seaLevelLine = L.polyline(latlngs, { color: '#ffc830', weight: 3, opacity: 0.92 }).addTo(leafletMap);

  // Legend
  let legendDiv;
  const legend = L.control({ position: 'bottomright' });
  legend.onAdd = () => {
    legendDiv = L.DomUtil.create('div', '');
    legendDiv.style.cssText = 'background:rgba(8,8,22,0.93);color:#c0c8f0;padding:8px 12px;border-radius:6px;border:1px solid #203060;font-size:11px;line-height:2;pointer-events:none';
    legendDiv.innerHTML =
      '<div><span style="display:inline-block;width:22px;height:3px;background:#ffc830;margin-right:7px;vertical-align:middle"></span>Sea level</div>' +
      '<div><span style="display:inline-block;width:22px;height:3px;background:#00d4ff;margin-right:7px;vertical-align:middle"></span>Terrain corrected</div>';
    return legendDiv;
  };
  legend.addTo(leafletMap);

  // Elevation correction — triggered by clicking the sea-level path line
  async function applyElevationCorrection() {
    if (!GOOGLE_ELEVATION_API_KEY) {
      document.getElementById('map-elev-status').innerHTML =
        '<span style="color:#ff8060">Add your Google Elevation API key to GOOGLE_ELEVATION_API_KEY in the script to enable terrain correction.</span>';
      return;
    }
    const bounds = leafletMap.getBounds();
    const inView = path.filter(p => bounds.contains([p.lat, p.lon]));
    if (inView.length === 0) {
      document.getElementById('map-elev-status').innerHTML =
        '<span style="color:#ff8060">No transit path visible — pan to the path first.</span>';
      return;
    }
    const elevStatus = document.getElementById('map-elev-status');
    elevStatus.innerHTML = `<span style="color:#6080c0">Fetching terrain elevations…</span>`;

    // Try Google via corsproxy.io (512 samples). On failure, fall back to Open-Topo-Data (100 samples).
    let sampled, elevations, source;
    try {
      const step = Math.max(1, Math.ceil(inView.length / 512));
      sampled = inView.filter((_, i) => i % step === 0);
      elevStatus.innerHTML = `<span style="color:#6080c0">Fetching via Google (${sampled.length} points)…</span>`;
      elevations = await fetchElevationsGoogle(sampled.map(p => ({ lat: p.lat, lon: p.lon })));
      source = 'Google Elevation';
    } catch (primaryErr) {
      try {
        const step = Math.max(1, Math.ceil(inView.length / 100));
        sampled = inView.filter((_, i) => i % step === 0);
        elevStatus.innerHTML = `<span style="color:#6080c0">Google unavailable — trying Open-Topo-Data (${sampled.length} points)…</span>`;
        elevations = await fetchElevationsOpenTopo(sampled.map(p => ({ lat: p.lat, lon: p.lon })));
        source = 'Open-Topo-Data (fallback)';
      } catch (fallbackErr) {
        elevStatus.innerHTML = `<span style="color:#ff8060">Elevation fetch failed. Google: ${primaryErr.message} · Fallback: ${fallbackErr.message}</span>`;
        return;
      }
    }

    try {
      const correctedLatlngs = [];
      for (let i = 0; i < sampled.length; i++) {
        const pt = sampled[i];
        const correctedEci = findTransitPointAtElevation(pt.satEci, pt.bodyEci, elevations[i] / 1000);
        if (!correctedEci) continue;
        const geod = satellite.eciToGeodetic(correctedEci, satellite.gstime(pt.time));
        correctedLatlngs.push([geod.latitude / DEG, geod.longitude / DEG]);
      }
      if (correctedLatlngs.length > 1) {
        L.polyline(correctedLatlngs, { color: '#00d4ff', weight: 3, opacity: 0.95 }).addTo(leafletMap);
        elevStatus.innerHTML =
          `<span style="color:#00d4ff">✓ Terrain correction applied — ${sampled.length} samples via ${source}. Zoom in and click again for finer correction.</span>`;
        if (legendDiv) legendDiv.innerHTML =
          '<div><span style="display:inline-block;width:22px;height:3px;background:#ffc830;margin-right:7px;vertical-align:middle"></span>Sea level</div>' +
          `<div><span style="display:inline-block;width:22px;height:3px;background:#00d4ff;margin-right:7px;vertical-align:middle"></span>Terrain corrected (${source})</div>`;
      } else {
        elevStatus.innerHTML = '<span style="color:#ff8060">Could not compute corrected path for this area.</span>';
      }
    } catch (e) {
      elevStatus.innerHTML = `<span style="color:#ff8060">Error applying correction: ${e.message}</span>`;
    }
  }

  seaLevelLine.on('click', applyElevationCorrection);

  // Path start (cyan) and end (orange) dots
  L.circleMarker(latlngs[0], { radius: 5, color: '#00e8cc', fillColor: '#00e8cc', fillOpacity: 1, weight: 1 })
    .addTo(leafletMap).bindPopup(`Path starts: ${fmtTime(path[0].time)}`);
  L.circleMarker(latlngs[latlngs.length - 1], { radius: 5, color: '#ff7040', fillColor: '#ff7040', fillOpacity: 1, weight: 1 })
    .addTo(leafletMap).bindPopup(`Path ends: ${fmtTime(path[path.length - 1].time)}`);

  // Nearest point to user (gold, with popup open)
  let minDist = Infinity, closest = null;
  path.forEach(p => {
    const d = haversineKm(currentLat, currentLon, p.lat, p.lon);
    if (d < minDist) { minDist = d; closest = p; }
  });

  L.circleMarker([closest.lat, closest.lon], {
    radius: 9, color: '#fff', weight: 2, fillColor: '#ffc830', fillOpacity: 1,
  }).addTo(leafletMap)
    .bindPopup(`<b>Stand here at ${fmtTime(closest.time)}</b><br>${minDist.toFixed(2)} km from your location`)
    ;

  // Fit map to show user + full path
  leafletMap.fitBounds(L.latLngBounds([[currentLat, currentLon], ...latlngs]), { padding: [40, 40] });
  leafletMap.invalidateSize();

  // Info bar
  const distStr = fmtTransitDist(minDist);
  document.getElementById('map-info').innerHTML =
    `<strong>Nearest transit point:</strong> ${distStr} from your location &nbsp;·&nbsp; ` +
    `<strong>Be there at:</strong> ${fmtTime(closest.time)} local` +
    `<br><span style="color:#40507a;font-size:0.82em">⚠ Accuracy limited by TLE precision (~100–500 m). Refresh ISS data on the day of the event for best results.</span>` +
    `<br><span style="color:#506080;font-size:0.82em">For best accuracy, zoom into your target area first, then click the gold line to apply terrain elevation correction. Click again after zooming for finer results.</span>`;
  document.getElementById('map-elev-status').textContent = '';
}

function closeTransitMap() {
  document.getElementById('map-modal').style.display = 'none';
  if (leafletMap) { leafletMap.remove(); leafletMap = null; }
}

// Close modal when clicking outside the panel
document.getElementById('map-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('map-modal')) closeTransitMap();
});

// ── MAIN ──────────────────────────────────────────────────────────────────
async function run(lat, lon, locationName) {
  document.getElementById('results').style.display = 'block';
  document.getElementById('pass-tbody').innerHTML = '';
  document.getElementById('charts-grid').innerHTML = '';
  document.getElementById('no-passes').style.display = 'none';
  document.getElementById('pass-table').style.display = '';

  const coordStr = `${lat >= 0 ? lat.toFixed(3) + '°N' : Math.abs(lat).toFixed(3) + '°S'}, ` +
                   `${lon >= 0 ? lon.toFixed(3) + '°E' : Math.abs(lon).toFixed(3) + '°W'}`;
  document.getElementById('loc-display').textContent =
    `Location: ${locationName ? locationName + ' · ' : ''}${coordStr} · Next ${getDaysAhead()} days`;

  if (!TLE || !TLE.line1) {
    setStatus('ISS data not loaded — click ↻ Refresh ISS Data and try again.');
    return;
  }

  setStatus('Scanning for ISS passes (this takes a few seconds)…');

  // Yield to browser so status message renders before computation starts
  await new Promise(r => setTimeout(r, 50));

  let passes;
  try {
    passes = findPasses(lat, lon);
  } catch (e) {
    setStatus('Error computing passes: ' + e.message);
    return;
  }

  setStatus('Computing planet positions and transit distances…');
  await new Promise(r => setTimeout(r, 10));

  addCloseApproaches(passes, lat, lon);
  passes.forEach((p, i) => { p.idx = i; });
  currentPasses = passes;

  const planetCount = passes.filter(p => p.closeApproaches.length > 0).length;
  const displayPasses = getShowMode() === 'planet'
    ? passes.filter(p => p.closeApproaches.length > 0)
    : passes;

  const filterNote = getShowMode() === 'planet' && displayPasses.length < passes.length
    ? ` (filtered to ${displayPasses.length} with planet/Moon passes)`  : '';
  setStatus(`Found ${passes.length} visible pass${passes.length !== 1 ? 'es' : ''} · ` +
            `${planetCount} near a planet or Moon${filterNote}`);

  renderTable(displayPasses);
  renderCharts(displayPasses);
}

// ── LOCATION SETUP ────────────────────────────────────────────────────────
function toggleManual() {
  const div = document.getElementById('manual-inputs');
  div.style.display = div.style.display === 'flex' ? 'none' : 'flex';
}

function useManual() {
  const lat = parseFloat(document.getElementById('inp-lat').value);
  const lon = parseFloat(document.getElementById('inp-lon').value);
  if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
    setStatus('Please enter a valid latitude (−90 to 90) and longitude (−180 to 180).');
    return;
  }
  currentLat = lat; currentLon = lon;
  document.getElementById('btn-generate').disabled = false;
  setStatus('Location set — click Generate Passes to search.');
}

function generatePasses() {
  if (currentLat === null || currentLon === null) {
    setStatus('Please set your location first.');
    return;
  }
  run(currentLat, currentLon, null);
}

document.getElementById('btn-locate').addEventListener('click', () => {
  if (!navigator.geolocation) {
    setStatus('Geolocation not supported by this browser. Please enter coordinates manually.');
    return;
  }
  setStatus('Requesting location…');
  document.getElementById('btn-locate').disabled = true;
  navigator.geolocation.getCurrentPosition(
    pos => {
      document.getElementById('btn-locate').disabled = false;
      currentLat = pos.coords.latitude; currentLon = pos.coords.longitude;
      document.getElementById('btn-generate').disabled = false;
      setStatus('Location detected — click Generate Passes to search.');
    },
    err => {
      document.getElementById('btn-locate').disabled = false;
      setStatus('Location denied or unavailable. Enter coordinates manually.');
      document.getElementById('manual-inputs').style.display = 'flex';
    },
    { timeout: 10000 }
  );
});

// ── Enter key support for manual inputs ──────────────────────────────────
document.getElementById('inp-lon').addEventListener('keydown', e => {
  if (e.key === 'Enter') useManual();
});

// ── Re-run when settings change (if location already set) ─────────────────
function onSettingChange() {
  // Settings changes don't auto-run — user clicks Generate Passes
}
document.getElementById('sel-threshold').addEventListener('change', onSettingChange);
document.getElementById('inp-days').addEventListener('change', onSettingChange);
document.getElementById('sel-units').addEventListener('change', onSettingChange);
document.getElementById('sel-show').addEventListener('change', onSettingChange);

// Auto-fetch TLE on every page load
initTLE();
</script>
</body>
</html>
